[project]
name = "aprendizaje-avanzado"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "miguelortizR", email = "miguel.ortiz01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "xlrd>=2.0.2",
]

[project.scripts]
aprendizaje-avanzado = "aprendizaje_avanzado:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
